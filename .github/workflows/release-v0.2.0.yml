name: Release v0.2.0

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: v0.2.0
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build release artifacts
        run: python build/build_release.py

      - name: Show generated hashes
        run: cat dist/SHA256SUMS.txt

      - name: Create GitHub release if missing
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving published assets unchanged."
            exit 0
          fi

          gh release create "$TAG" \
            dist/RokuLANRemote.exe \
            dist/RokuLANRemote-Package-0.2.0.exe \
            dist/RokuLANRemote-0.2.0-portable.zip \
            dist/RokuLANRemote-0.2.0-release.zip \
            dist/RokuLANRemote-0.2.0-source.zip \
            dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "RokuLAN Remote v0.2.0" \
            --notes-file RELEASE_NOTES_0.2.0.md
